name: policy-links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 1 * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify official policy links
        run: node scripts/check-policy-links.mjs
