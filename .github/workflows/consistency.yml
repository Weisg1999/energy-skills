name: consistency

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Markdown structure, content discipline and CN/EN numbers
        run: node scripts/check-consistency.mjs
      - name: Check maintenance ledger structure
        run: node scripts/check-maintenance.mjs --check
      - name: Verify the generated province matrix is up to date
        run: node scripts/build-province-matrix.mjs --check
      - name: Verify the knowledge hub and credibility register are up to date
        run: node scripts/build-knowledge-html.mjs --check
      - name: Run the spot-bidding reference implementation self-test
        run: python skills/spot-bidding-quant/tools/selftest.py
      - name: Run the carbon-asset reference implementation self-test
        run: python skills/carbon-asset-expert/tools/selftest.py
      - name: Run the storage investment reference implementation self-test
        run: python skills/storage-investment-operations/tools/selftest.py
      - name: Run the renewable project development self-test
        run: python skills/renewable-project-development/tools/selftest.py
      - name: Run the EMS dispatch reference implementation self-test
        run: python skills/ems-dispatch/tools/selftest.py
      - name: Run the retail electricity and risk reference implementation self-test
        run: python skills/retail-electricity-risk/tools/selftest.py
      - name: Run the tariff and bill optimization self-test
        run: python skills/tariff-bill-optimization/tools/selftest.py
      - name: Run the electricity-trading reference implementation self-test
        run: python skills/electricity-trading-expert/tools/selftest.py
      - name: Run the VPP reference implementation self-test
        run: python skills/virtual-power-plant/tools/selftest.py
