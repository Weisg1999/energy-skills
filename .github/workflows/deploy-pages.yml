name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.nojekyll'
      - 'knowledge/**'
      - 'skills/**'
      - 'README.md'
      - 'README_EN.md'
      - 'LICENSE'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify the generated province matrix is current
        run: node scripts/build-province-matrix.mjs --check

      - name: Verify generated knowledge hub is current
        run: node scripts/build-knowledge-html.mjs --check

      - name: Check structure and content consistency
        run: node scripts/check-consistency.mjs

      - name: Check maintenance ledger structure
        run: node scripts/check-maintenance.mjs --check

      - name: Stage the public site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R knowledge _site/knowledge
          cp -R skills _site/skills
          cp index.html README.md README_EN.md LICENSE .nojekyll _site/
          test -f _site/index.html
          test -f _site/knowledge/index.html
          test -f _site/knowledge/instances.html
          test -f _site/knowledge/search-index.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
